name: Build standard edition

on:
  push:
    branches: [main, 'test/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Optional fixed source commit from the validated release intent
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Public verification is self-contained; Pro product checks belong to its own root.
# No secrets are inherited by this tests-only reusable workflow.
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
