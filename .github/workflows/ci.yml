name: Build and test

on:
  push:
    branches: [main, 'test/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android tests, lint and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned Gradle wrapper
        run: python3 scripts/verify-wrapper.py
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.2 build-tools;36.0.0'
      - name: Test release metadata and signing input guards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Run shared and Android checks
        run: bash scripts/ci-android.sh
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-${{ github.run_id }}
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            androidApp/build/reports/
            androidApp/build/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: better-zslf-debug-${{ github.sha }}
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS framework and unsigned simulator app
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Kotlin 2.4.21's supported Xcode line. Never silently fall back to latest.
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned Gradle wrapper
        run: python3 scripts/verify-wrapper.py
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Configure Android compile SDK for KMP configuration
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # v22+ mac archives use mac_arm64/mac_x86_64; this v3 action expects mac-{id}.
          cmdline-tools-version: '15641748'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.2 build-tools;36.0.0'
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build iOS on macOS
        run: bash scripts/ci-ios.sh
      - name: Upload simulator app and build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: better-zslf-ios-simulator-${{ github.sha }}
          include-hidden-files: true # Only the narrowly listed .local/ios-ci outputs.
          path: |
            shared/build/bin/iosSimulatorArm64/debugFramework/
            .local/ios-ci/Build/Products/Debug-iphonesimulator/*.app
            .local/ios-ci/Logs/
            .local/ios-ci/build.xcresult
          if-no-files-found: warn
          retention-days: 7
