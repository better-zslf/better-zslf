name: 功能异常
description: 客户端功能不正常、崩溃、数据不符
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请只提交脱敏后的复现信息。移除学号、手机号、姓名、身份证号、密码、token、Cookie、定位轨迹及设备密钥；截图与日志也应遮盖这些信息。
  - type: dropdown
    id: ftype
    attributes:
      label: 问题类型
      options:
        - 功能异常
        - 登录问题
        - 数据不符
        - 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？期望的结果是什么？
      placeholder: 例如：打开「校园动态」页面一直转圈，列表未显示
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 进入 xx 页面
        2. 点击 xx
        3. 出现 xx
    validations:
      required: true
  - type: input
    id: appver
    attributes:
      label: App 版本
      placeholder: 例如 0.1.0 (1)，可从「设置 / 关于」查看
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统版本
      placeholder: 例如 Android 14 / iOS 17.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备型号（选填）
      placeholder: 只填写型号，不填写序列号、IMEI 或蓝牙地址
    validations:
      required: false
  - type: textarea
    id: shots
    attributes:
      label: 截图或录屏
      description: 直接拖拽脱敏后的图片到本区域即可上传
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已移除正文、截图和日志中的账号凭据与个人信息。
          required: true
