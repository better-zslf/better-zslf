name: BetterZslf
options:
  minimumXcodeGenVersion: "2.42.0"
  bundleIdPrefix: io.github
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
fileGroups:
  - Info.plist
  - README.md
  - scripts
  - ../version.properties
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The KMP module defines iosArm64 and iosSimulatorArm64, not an Intel simulator target.
    ARCHS: arm64
targets:
  BetterZslf:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
    configFiles:
      Debug: .generated/Version.xcconfig
      Release: .generated/Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BETTER_ZSLF_BUNDLE_ID)"
        PRODUCT_NAME: BetterZslf
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        VERSIONING_SYSTEM: apple-generic
        MARKETING_VERSION: "$(BETTER_ZSLF_VERSION_NAME)"
        CURRENT_PROJECT_VERSION: "$(BETTER_ZSLF_VERSION_CODE)"
        FRAMEWORK_SEARCH_PATHS: '$(inherited) "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"'
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
    dependencies:
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
    preBuildScripts:
      - name: Build Shared Kotlin framework
        script: /bin/bash "$SRCROOT/scripts/embed-shared-framework.sh"
        basedOnDependencyAnalysis: false
        showEnvVars: false
schemes:
  BetterZslf:
    build:
      targets:
        BetterZslf: all
    run:
      config: Debug
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
    management:
      shared: true
      isShown: true
